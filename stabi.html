<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SBB Lernapp – Staatsbürgerliche Bildung</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;900&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0f0f12;
    --surface: #1a1a20;
    --surface2: #22222a;
    --border: rgba(255,255,255,0.08);
    --accent: #c8a96e;
    --accent2: #7eb8a0;
    --text: #e8e6e0;
    --text-muted: #8a8880;
    --must: #7eb8a0;
    --good: #6b9fd4;
    --overview: #888780;
    --must-bg: rgba(126,184,160,0.12);
    --good-bg: rgba(107,159,212,0.12);
    --overview-bg: rgba(136,135,128,0.1);
    --correct: #7eb8a0;
    --wrong: #c07070;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: 'DM Sans', sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    font-size: 15px;
    line-height: 1.6;
  }

  /* NOISE TEXTURE OVERLAY */
  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.03'/%3E%3C/svg%3E");
    pointer-events: none;
    z-index: 0;
    opacity: 0.4;
  }

  /* LAYOUT */
  .app { display: flex; min-height: 100vh; position: relative; z-index: 1; }

  /* SIDEBAR */
  .sidebar {
    width: 300px;
    flex-shrink: 0;
    background: var(--surface);
    border-right: 1px solid var(--border);
    display: flex;
    flex-direction: column;
    position: sticky;
    top: 0;
    height: 100vh;
    overflow-y: auto;
  }

  .sidebar-header {
    padding: 28px 24px 20px;
    border-bottom: 1px solid var(--border);
  }

  .sidebar-title {
    font-family: 'Playfair Display', serif;
    font-size: 22px;
    font-weight: 900;
    color: var(--accent);
    line-height: 1.2;
    margin-bottom: 4px;
  }

  .sidebar-sub {
    font-size: 11px;
    color: var(--text-muted);
    text-transform: uppercase;
    letter-spacing: 1.5px;
  }

  .progress-bar {
    margin: 16px 24px 0;
    height: 3px;
    background: var(--border);
    border-radius: 2px;
  }
  .progress-fill {
    height: 100%;
    background: var(--accent);
    border-radius: 2px;
    transition: width 0.4s ease;
  }
  .progress-label {
    font-size: 11px;
    color: var(--text-muted);
    margin: 6px 24px 0;
  }

  .category-nav { padding: 12px 0; flex: 1; }

  .cat-btn {
    display: block;
    width: 100%;
    text-align: left;
    padding: 10px 24px;
    background: none;
    border: none;
    color: var(--text-muted);
    font-family: 'DM Sans', sans-serif;
    font-size: 13px;
    cursor: pointer;
    transition: all 0.2s;
    border-left: 3px solid transparent;
    line-height: 1.4;
  }
  .cat-btn:hover { color: var(--text); background: rgba(255,255,255,0.03); }
  .cat-btn.active { color: var(--accent); border-left-color: var(--accent); background: rgba(200,169,110,0.06); }
  .cat-btn .cat-num { font-size: 10px; color: var(--text-muted); display: block; margin-top: 2px; }

  /* MAIN CONTENT */
  .main { flex: 1; padding: 48px 56px; max-width: 860px; }

  .page-header {
    margin-bottom: 40px;
    opacity: 0;
    animation: fadeUp 0.5s ease forwards;
  }

  .category-label {
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 2px;
    color: var(--accent);
    margin-bottom: 10px;
  }

  .page-title {
    font-family: 'Playfair Display', serif;
    font-size: 36px;
    font-weight: 900;
    line-height: 1.15;
    margin-bottom: 16px;
  }

  .priority-tags { display: flex; gap: 8px; flex-wrap: wrap; }
  .tag {
    font-size: 11px;
    padding: 3px 10px;
    border-radius: 20px;
    font-weight: 500;
  }
  .tag-must { background: var(--must-bg); color: var(--must); border: 1px solid rgba(126,184,160,0.3); }
  .tag-good { background: var(--good-bg); color: var(--good); border: 1px solid rgba(107,159,212,0.3); }
  .tag-overview { background: var(--overview-bg); color: var(--overview); border: 1px solid rgba(136,135,128,0.25); }

  /* QUESTION CARDS */
  .questions-section { margin-bottom: 48px; }
  .section-label {
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 2px;
    color: var(--text-muted);
    margin-bottom: 20px;
  }

  .question-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 12px;
    margin-bottom: 16px;
    overflow: hidden;
    opacity: 0;
    animation: fadeUp 0.4s ease forwards;
  }

  .q-header {
    display: flex;
    align-items: flex-start;
    gap: 14px;
    padding: 18px 20px;
    cursor: pointer;
    transition: background 0.2s;
  }
  .q-header:hover { background: rgba(255,255,255,0.02); }

  .q-number {
    font-family: 'Playfair Display', serif;
    font-size: 20px;
    font-weight: 700;
    color: var(--accent);
    min-width: 32px;
    line-height: 1;
    margin-top: 2px;
  }

  .q-title {
    flex: 1;
    font-size: 15px;
    font-weight: 500;
    line-height: 1.4;
  }

  .q-priority {
    font-size: 10px;
    padding: 2px 8px;
    border-radius: 20px;
    flex-shrink: 0;
    margin-top: 3px;
  }

  .q-toggle {
    width: 20px;
    height: 20px;
    border-radius: 50%;
    border: 1px solid var(--border);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 12px;
    color: var(--text-muted);
    flex-shrink: 0;
    margin-top: 2px;
    transition: transform 0.25s;
  }
  .question-card.open .q-toggle { transform: rotate(180deg); }

  .q-body {
    display: none;
    padding: 0 20px 20px;
    border-top: 1px solid var(--border);
  }
  .question-card.open .q-body { display: block; }

  .explanation {
    padding-top: 18px;
    color: var(--text);
    font-size: 14px;
    line-height: 1.75;
  }

  .explanation h4 {
    font-family: 'DM Sans', sans-serif;
    font-size: 12px;
    font-weight: 500;
    text-transform: uppercase;
    letter-spacing: 1.5px;
    color: var(--accent);
    margin: 20px 0 10px;
  }
  .explanation h4:first-child { margin-top: 0; }

  .explanation p { margin-bottom: 12px; }
  .explanation ul { padding-left: 18px; margin-bottom: 12px; }
  .explanation li { margin-bottom: 4px; }

  .expl-table {
    width: 100%;
    border-collapse: collapse;
    margin: 12px 0;
    font-size: 13px;
  }
  .expl-table th {
    text-align: left;
    padding: 8px 12px;
    background: var(--surface2);
    color: var(--accent);
    font-weight: 500;
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 1px;
  }
  .expl-table td {
    padding: 8px 12px;
    border-bottom: 1px solid var(--border);
    vertical-align: top;
  }
  .expl-table tr:last-child td { border-bottom: none; }

  .tip-box {
    background: rgba(200,169,110,0.08);
    border-left: 3px solid var(--accent);
    padding: 12px 16px;
    border-radius: 0 8px 8px 0;
    margin: 16px 0;
    font-size: 13px;
  }
  .tip-box strong { color: var(--accent); }

  /* QUIZ SECTION */
  .quiz-section {
    margin-top: 48px;
    padding-top: 40px;
    border-top: 1px solid var(--border);
  }

  .quiz-title {
    font-family: 'Playfair Display', serif;
    font-size: 24px;
    font-weight: 700;
    margin-bottom: 8px;
  }

  .quiz-subtitle {
    font-size: 13px;
    color: var(--text-muted);
    margin-bottom: 32px;
  }

  .quiz-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 28px;
    margin-bottom: 20px;
    opacity: 0;
    animation: fadeUp 0.4s ease forwards;
  }

  .quiz-q-number {
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 1.5px;
    color: var(--text-muted);
    margin-bottom: 12px;
  }

  .quiz-question {
    font-size: 16px;
    font-weight: 500;
    line-height: 1.5;
    margin-bottom: 22px;
  }

  .options { display: flex; flex-direction: column; gap: 10px; }

  .option-btn {
    display: flex;
    align-items: flex-start;
    gap: 12px;
    padding: 12px 16px;
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: 10px;
    cursor: pointer;
    text-align: left;
    font-family: 'DM Sans', sans-serif;
    font-size: 14px;
    color: var(--text);
    transition: all 0.2s;
    line-height: 1.4;
  }
  .option-btn:hover:not(:disabled) {
    border-color: rgba(200,169,110,0.4);
    background: rgba(200,169,110,0.06);
  }
  .option-btn:disabled { cursor: default; }

  .option-letter {
    width: 22px;
    height: 22px;
    border-radius: 50%;
    background: var(--border);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 11px;
    font-weight: 500;
    flex-shrink: 0;
    margin-top: 1px;
    transition: all 0.2s;
  }

  .option-btn.correct {
    border-color: var(--correct);
    background: rgba(126,184,160,0.1);
  }
  .option-btn.correct .option-letter {
    background: var(--correct);
    color: #0f1f1a;
  }
  .option-btn.wrong {
    border-color: var(--wrong);
    background: rgba(192,112,112,0.1);
  }
  .option-btn.wrong .option-letter {
    background: var(--wrong);
    color: #1f0f0f;
  }

  .quiz-feedback {
    margin-top: 16px;
    padding: 14px 16px;
    border-radius: 8px;
    font-size: 13px;
    line-height: 1.6;
    display: none;
  }
  .quiz-feedback.show { display: block; }
  .quiz-feedback.correct-fb {
    background: rgba(126,184,160,0.12);
    border-left: 3px solid var(--correct);
    color: var(--correct);
  }
  .quiz-feedback.wrong-fb {
    background: rgba(192,112,112,0.13);
    border-left: 3px solid var(--wrong);
    color: #e09090;
  }

  /* SCORE */
  .score-summary {
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 24px 28px;
    margin-top: 32px;
    display: flex;
    align-items: center;
    gap: 24px;
  }
  .score-number {
    font-family: 'Playfair Display', serif;
    font-size: 48px;
    font-weight: 900;
    color: var(--accent);
    line-height: 1;
  }
  .score-info { flex: 1; }
  .score-label { font-size: 13px; color: var(--text-muted); }
  .score-bar { height: 6px; background: var(--border); border-radius: 3px; margin-top: 10px; }
  .score-fill { height: 100%; border-radius: 3px; background: var(--accent); transition: width 0.8s ease; }

  .reset-btn {
    padding: 10px 24px;
    background: none;
    border: 1px solid var(--accent);
    color: var(--accent);
    border-radius: 8px;
    font-family: 'DM Sans', sans-serif;
    font-size: 13px;
    cursor: pointer;
    transition: all 0.2s;
  }
  .reset-btn:hover { background: var(--accent); color: var(--bg); }

  /* ANIMATIONS */
  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(16px); }
    to { opacity: 1; transform: translateY(0); }
  }

  /* SCROLLBAR */
  ::-webkit-scrollbar { width: 6px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }

  /* MOBILE */
  @media (max-width: 768px) {
    .app { flex-direction: column; }
    .sidebar { width: 100%; height: auto; position: static; }
    .main { padding: 28px 20px; }
    .page-title { font-size: 26px; }
  }
</style>
</head>
<body>
<div class="app">
  <nav class="sidebar">
    <div class="sidebar-header">
      <div class="sidebar-title">SBB Lernapp</div>
      <div class="sidebar-sub">Staatsbürgerliche Bildung</div>
    </div>
    <div class="progress-bar" style="margin-top:16px;">
      <div class="progress-fill" id="globalProgress" style="width:0%"></div>
    </div>
    <div class="progress-label" id="globalProgressLabel">0 von 81 Fragen bearbeitet</div>
    <div class="category-nav" id="categoryNav"></div>
  </nav>

  <main class="main" id="mainContent"></main>
</div>

<script>
const categories = [
  {
    id: "grundrechte",
    icon: "🏛️",
    title: "Grundgesetz & Grundrechte",
    questions: [
      {
        n: 4,
        title: "Menschen- vs. Bürgerrechte",
        priority: "must",
        explanation: `
          <h4>Kernunterschied</h4>
          <p><strong>Menschenrechte</strong> gelten für <em>jeden Menschen</em> weltweit – unabhängig von Staatsangehörigkeit, Aufenthaltsstatus oder Herkunft. Sie sind universell, unveräußerlich und vorstaatlich.</p>
          <p><strong>Bürgerrechte (Deutschenrechte)</strong> gelten nur für <em>deutsche Staatsbürger</em> (i.S.d. Art. 116 GG).</p>
          <h4>Erkennungsmerkmale im GG</h4>
          <table class="expl-table">
            <tr><th>Typ</th><th>Wortlaut</th><th>Beispiele</th></tr>
            <tr><td>Menschenrecht</td><td>„Jeder hat das Recht…" / „Die Würde…"</td><td>Art. 1, 2, 3, 4</td></tr>
            <tr><td>Bürgerrecht</td><td>„Alle Deutschen haben das Recht…"</td><td>Art. 8, 9, 11, 12, 16, 33</td></tr>
          </table>
          <h4>Wichtige Beispiele</h4>
          <ul>
            <li><strong>Art. 1 GG</strong> – Menschenwürde → Menschenrecht</li>
            <li><strong>Art. 2 GG</strong> – Freie Entfaltung → Menschenrecht</li>
            <li><strong>Art. 8 GG</strong> – Versammlungsfreiheit → Bürgerrecht</li>
            <li><strong>Art. 11 GG</strong> – Freizügigkeit → Bürgerrecht</li>
            <li><strong>Art. 12 GG</strong> – Berufsfreiheit → Bürgerrecht</li>
          </ul>
          <div class="tip-box"><strong>Prüfungstipp:</strong> Ein Asylbewerber kann sich auf Art. 1 und 2 GG berufen, aber nicht auf Art. 8 oder 12. EU-Bürger erhalten manche Bürgerrechte jedoch über das EU-Recht (z.B. Freizügigkeit).</div>
        `
      },
      {
        n: 5,
        title: "Rechte & Pflichten des Staatsbürgers",
        priority: "good",
        explanation: `
          <h4>Rechte</h4>
          <ul>
            <li>Aktives und passives Wahlrecht (Art. 38 GG)</li>
            <li>Grundrechte (Art. 1–19 GG)</li>
            <li>Petitionsrecht (Art. 17 GG)</li>
            <li>Zugang zu öffentlichen Ämtern (Art. 33 GG)</li>
            <li>Schutz vor Auslieferung (Art. 16 GG)</li>
          </ul>
          <h4>Pflichten</h4>
          <ul>
            <li>Steuerpflicht</li>
            <li>Schulpflicht</li>
            <li>Verteidigungspflicht (Art. 12a GG)</li>
            <li>Sozialpflichtigkeit des Eigentums (Art. 14 GG)</li>
            <li>Gehorsamspflicht gegenüber Gesetzen</li>
          </ul>
          <div class="tip-box"><strong>Merksatz:</strong> Im demokratischen Rechtsstaat sind Rechte und Pflichten zwei Seiten derselben Medaille – Freiheit setzt Verantwortung voraus.</div>
        `
      },
      {
        n: 11,
        title: "Grundrechte im GG – Überblick",
        priority: "must",
        explanation: `
          <h4>Kategorien der Grundrechte</h4>
          <table class="expl-table">
            <tr><th>Kategorie</th><th>Beispiele</th></tr>
            <tr><td>Freiheitsrechte</td><td>Art. 2 (Handlungsfreiheit), Art. 4 (Glaubensfreiheit), Art. 5 (Meinungsfreiheit), Art. 8 (Versammlungsfreiheit)</td></tr>
            <tr><td>Gleichheitsrechte</td><td>Art. 3 (Gleichheit vor dem Gesetz), Art. 33 (gleicher Zugang zu Ämtern)</td></tr>
            <tr><td>Justizgrundrechte</td><td>Art. 101 (gesetzlicher Richter), Art. 103 (rechtliches Gehör)</td></tr>
          </table>
          <h4>Besondere Grundrechte</h4>
          <ul>
            <li><strong>Art. 1 GG</strong> – Menschenwürde: „Ewigkeitsgarantie", nicht änderbar (Art. 79 III GG)</li>
            <li><strong>Art. 19 IV GG</strong> – Rechtswegsgarantie: Wer durch die öffentliche Gewalt verletzt wird, kann Gerichte anrufen</li>
          </ul>
          <div class="tip-box"><strong>Prüfungstipp:</strong> Art. 1 und 20 GG sind durch Art. 79 III GG absolut geschützt – selbst eine verfassungsändernde Mehrheit kann sie nicht abschaffen.</div>
        `
      },
      {
        n: 12,
        title: "Einschränkung von Grundrechten",
        priority: "must",
        explanation: `
          <h4>Grundsatz</h4>
          <p>Grundrechte können eingeschränkt werden, aber nur unter strengen Voraussetzungen. Voraussetzungen: <strong>Gesetzesvorbehalt</strong> (nur durch oder aufgrund eines Gesetzes), <strong>Verhältnismäßigkeit</strong> und Wahrung des <strong>Wesensgehalts</strong> (Art. 19 II GG).</p>
          <h4>Arten des Gesetzesvorbehalts</h4>
          <ul>
            <li><strong>Einfacher Gesetzesvorbehalt:</strong> „durch Gesetz" (z.B. Art. 8 II GG – Versammlungsfreiheit unter freiem Himmel)</li>
            <li><strong>Qualifizierter Gesetzesvorbehalt:</strong> Gesetz muss bestimmte Zwecke verfolgen (z.B. Art. 11 II GG)</li>
            <li><strong>Keine Schranke:</strong> Art. 1 GG – Menschenwürde ist absolut, kein Gesetzesvorbehalt</li>
          </ul>
          <h4>Verhältnismäßigkeitsprinzip</h4>
          <ul>
            <li>Geeignetheit: Maßnahme muss Ziel erreichen können</li>
            <li>Erforderlichkeit: Mildestes Mittel</li>
            <li>Angemessenheit: Zweck-Mittel-Relation muss stimmen</li>
          </ul>
        `
      },
      {
        n: 13,
        title: "Verwirkung von Grundrechten",
        priority: "must",
        explanation: `
          <h4>Grundlage: Art. 18 GG</h4>
          <p>Wer bestimmte Grundrechte missbraucht, um die freiheitlich demokratische Grundordnung zu bekämpfen, kann diese Grundrechte <strong>verwirken</strong>.</p>
          <h4>Betroffene Grundrechte</h4>
          <ul>
            <li>Meinungsfreiheit (Art. 5 I)</li>
            <li>Pressefreiheit (Art. 5 I)</li>
            <li>Lehrfreiheit (Art. 5 III)</li>
            <li>Versammlungsfreiheit (Art. 8)</li>
            <li>Vereinigungsfreiheit (Art. 9)</li>
            <li>Brief-, Post- und Fernmeldegeheimnis (Art. 10)</li>
            <li>Eigentumsrecht (Art. 14)</li>
            <li>Asylrecht (Art. 16a)</li>
          </ul>
          <h4>Verfahren</h4>
          <p>Nur das <strong>Bundesverfassungsgericht</strong> kann die Verwirkung aussprechen – auf Antrag von Bundestag, Bundesrat oder Bundesregierung. Bisher wurde noch kein Fall entschieden.</p>
          <div class="tip-box"><strong>Unterschied zu Art. 9 II:</strong> Art. 18 betrifft Einzelpersonen, Art. 9 II das Vereinsverbot.</div>
        `
      },
      {
        n: 14,
        title: "Schutz der Grundrechte",
        priority: "must",
        explanation: `
          <h4>Schutzinstrumente</h4>
          <ul>
            <li><strong>Verfassungsbeschwerde (Art. 93 I Nr. 4a GG):</strong> Jeder kann das Bundesverfassungsgericht anrufen, wenn er sich in Grundrechten verletzt fühlt – nach Erschöpfung des Rechtswegs</li>
            <li><strong>Bindung aller Staatsgewalt (Art. 1 III GG):</strong> Gesetzgebung, vollziehende Gewalt und Rechtsprechung sind direkt an die Grundrechte gebunden</li>
            <li><strong>Ewigkeitsgarantie (Art. 79 III GG):</strong> Art. 1 und 20 GG sind unabänderlich</li>
            <li><strong>Wesensgehaltsgarantie (Art. 19 II GG):</strong> Kerngehalt eines Grundrechts darf nie angetastet werden</li>
            <li><strong>Rechtswegsgarantie (Art. 19 IV GG):</strong> Zugang zu Gerichten bei Verletzung durch öffentliche Gewalt</li>
          </ul>
          <h4>Institutioneller Schutz</h4>
          <ul>
            <li>Bundesverfassungsgericht (Karlsruhe)</li>
            <li>Verwaltungsgerichte</li>
            <li>Europäischer Gerichtshof für Menschenrechte (Straßburg) – für EMRK-Rechte</li>
          </ul>
        `
      },
      {
        n: 15,
        title: "Demokratieverständnis des GG / fdGO",
        priority: "must",
        explanation: `
          <h4>Art. 20 GG – Staatsprinzipien</h4>
          <ul>
            <li>Demokratieprinzip</li>
            <li>Rechtstaatsprinzip</li>
            <li>Bundesstaatsprinzip (Föderalismus)</li>
            <li>Sozialstaatsprinzip</li>
            <li>Republikprinzip</li>
          </ul>
          <h4>Freiheitlich demokratische Grundordnung (fdGO)</h4>
          <p>Laut Bundesverfassungsgericht umfasst sie:</p>
          <ul>
            <li>Achtung der im GG konkretisierten Menschenrechte</li>
            <li>Volkssouveränität</li>

// Track answered questions
const answered = {};
let totalAnswered = 0;
const totalQuestions = categories.reduce((sum, cat) => sum + cat.quiz.length, 0);

function updateProgress() {
  const pct = Math.round((totalAnswered / totalQuestions) * 100);
  document.getElementById('globalProgress').style.width = pct + '%';
  document.getElementById('globalProgressLabel').textContent = `${totalAnswered} von ${totalQuestions} Quiz-Fragen beantwortet`;
}

function buildNav() {
  const nav = document.getElementById('categoryNav');
  categories.forEach((cat, i) => {
    const btn = document.createElement('button');
    btn.className = 'cat-btn' + (i === 0 ? ' active' : '');
    btn.dataset.idx = i;
    btn.innerHTML = `${cat.icon} ${cat.title}<span class="cat-num">${cat.questions.length} Fragen · ${cat.quiz.length} Quiz</span>`;
    btn.onclick = () => loadCategory(i);
    nav.appendChild(btn);
  });
}

function loadCategory(idx) {
  document.querySelectorAll('.cat-btn').forEach((b, i) => b.classList.toggle('active', i === idx));
  const cat = categories[idx];
  const main = document.getElementById('mainContent');
  main.innerHTML = '';

  // Header
  const header = document.createElement('div');
  header.className = 'page-header';
  header.innerHTML = `
    <div class="category-label">${cat.icon} Themenblock</div>
    <div class="page-title">${cat.title}</div>
    <div class="priority-tags">
      <span class="tag tag-must">● Muss sitzen</span>
      <span class="tag tag-good">● Gut kennen</span>
      <span class="tag tag-overview">● Überblick reicht</span>
    </div>
  `;
  main.appendChild(header);

  // Questions
  const qSection = document.createElement('div');
  qSection.className = 'questions-section';
  qSection.innerHTML = '<div class="section-label">Lerninhalt</div>';

  cat.questions.forEach((q, qi) => {
    const card = document.createElement('div');
    card.className = 'question-card';
    card.style.animationDelay = (qi * 0.07) + 's';

    const pLabel = { must: '🟢 Muss sitzen', good: '🔵 Gut kennen', overview: '⚪ Überblick' }[q.priority];
    const pClass = { must: 'tag-must', good: 'tag-good', overview: 'tag-overview' }[q.priority];

    card.innerHTML = `
      <div class="q-header">
        <div class="q-number">${q.n}</div>
        <div class="q-title">${q.title}</div>
        <span class="tag ${pClass}" style="font-size:10px;padding:2px 8px;">${pLabel}</span>
        <div class="q-toggle">▼</div>
      </div>
      <div class="q-body">
        <div class="explanation">${q.explanation}</div>
      </div>
    `;

    card.querySelector('.q-header').onclick = () => {
      card.classList.toggle('open');
    };

    qSection.appendChild(card);
  });
  main.appendChild(qSection);

  // Quiz
  const quizSection = document.createElement('div');
  quizSection.className = 'quiz-section';
  quizSection.innerHTML = `
    <div class="quiz-title">📝 Teste dein Wissen</div>
    <div class="quiz-subtitle">${cat.quiz.length} Multiple-Choice-Fragen zu diesem Themenblock</div>
  `;

  const quizState = { score: 0, answered: 0 };

  cat.quiz.forEach((qz, qi) => {
    const card = document.createElement('div');
    card.className = 'quiz-card';
    card.style.animationDelay = (qi * 0.1) + 's';
    const letters = ['A', 'B', 'C', 'D'];

    let optionsHTML = qz.options.map((opt, oi) => `
      <button class="option-btn" data-idx="${oi}">
        <span class="option-letter">${letters[oi]}</span>
        <span>${opt}</span>
      </button>
    `).join('');

    card.innerHTML = `
      <div class="quiz-q-number">Frage ${qi + 1} von ${cat.quiz.length}</div>
      <div class="quiz-question">${qz.q}</div>
      <div class="options">${optionsHTML}</div>
      <div class="quiz-feedback"></div>
    `;

    card.querySelectorAll('.option-btn').forEach(btn => {
      btn.onclick = function() {
        if (this.disabled) return;
        const chosen = parseInt(this.dataset.idx);
        const isCorrect = chosen === qz.correct;

        card.querySelectorAll('.option-btn').forEach(b => {
          b.disabled = true;
          if (parseInt(b.dataset.idx) === qz.correct) b.classList.add('correct');
          else if (parseInt(b.dataset.idx) === chosen && !isCorrect) b.classList.add('wrong');
        });

        const fb = card.querySelector('.quiz-feedback');
        if (isCorrect) {
          fb.textContent = qz.feedback;
          fb.className = 'quiz-feedback show correct-fb';
        } else {
          fb.textContent = '✗ Leider falsch. Die richtige Antwort war: „' + qz.options[qz.correct] + '". ' + qz.feedback;
          fb.className = 'quiz-feedback show wrong-fb';
        }

        if (isCorrect) quizState.score++;
        quizState.answered++;
        totalAnswered++;
        updateProgress();

        if (quizState.answered === cat.quiz.length) {
          showScore(quizState.score, cat.quiz.length, scoreDiv);
        }
      };
    });

    quizSection.appendChild(card);
  });

  const scoreDiv = document.createElement('div');
  quizSection.appendChild(scoreDiv);
  main.appendChild(quizSection);

  main.scrollTop = 0;
}

function showScore(score, total, container) {
  const pct = Math.round((score / total) * 100);
  const emoji = pct >= 80 ? '🎉' : pct >= 60 ? '👍' : '📚';
  const label = pct >= 80 ? 'Ausgezeichnet!' : pct >= 60 ? 'Gut gemacht!' : 'Weiterüben!';

  container.innerHTML = `
    <div class="score-summary">
      <div>
        <div class="score-number">${score}/${total}</div>
        <div class="score-label">${emoji} ${label} · ${pct}% richtig</div>
        <div class="score-bar"><div class="score-fill" style="width:${pct}%"></div></div>
      </div>
      <button class="reset-btn" onclick="resetQuiz(this)">Nochmal versuchen</button>
    </div>
  `;
}

function resetQuiz(btn) {
  const activeBtn = document.querySelector('.cat-btn.active');
  if (activeBtn) loadCategory(parseInt(activeBtn.dataset.idx));
}

buildNav();
loadCategory(0);
</script>
